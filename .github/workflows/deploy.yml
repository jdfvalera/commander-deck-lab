name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild so the Commander Spellbook combo data stays fresh without a push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Week number for the combo cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: combos
        with:
          path: public/combos.json
          key: combos-${{ steps.week.outputs.week }}
      - name: Build combo database from Commander Spellbook
        if: steps.combos.outputs.cache-hit != 'true'
        run: npm run build:combos
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Only runs when every check above passed, so a failing test blocks the deploy.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
